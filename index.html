<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlive · 声音验证</title>
<style>
:root {color-scheme:dark;font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;background:#10141d;color:#eef2f8}
* {box-sizing:border-box} body {margin:0} main {max-width:1050px;margin:auto;padding:32px 20px}
h1,h2,p {margin:0} h1 {font-size:2.3rem} h2 {font-size:1.15rem} .muted,small {color:#b5bfd0}
.grid {display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin:22px 0}
section {background:#191f2c;border:1px solid #30394b;border-radius:16px;padding:20px}
label.file {display:block;margin-top:14px}
[hidden] {display:none !important} input[type=file] {display:block;max-width:100%;margin:4px 0}
small {display:block;overflow-wrap:anywhere} small[data-error] {color:#ffada5}
button {color:inherit;background:#242e42;border:1px solid #4b5970;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:disabled {opacity:.52;cursor:default} button[aria-pressed=true],#play:not(:disabled) {background:#9be8cb;color:#101d1d;border-color:#9be8cb}
button:focus-visible,input:focus-visible,#venue:focus-visible {outline:2px solid #a5efcf;outline-offset:3px}
.controls {display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.range {width:100%;accent-color:#a5efcf} .range-label {display:flex;justify-content:space-between;margin-top:10px}
#venue {position:relative;height:230px;margin:14px 0;border-radius:12px;background:linear-gradient(#283650,#171d2a);border:1px solid #475572;touch-action:none}
.stage {position:absolute;top:0;left:15%;width:70%;height:18%;text-align:center;padding-top:6px;background:#455578;border-radius:0 0 14px 14px}
.floor {position:absolute;left:8%;right:8%;top:26%;bottom:8%;border:1px dashed #62728c;border-radius:8px;cursor:crosshair;background:repeating-linear-gradient(to bottom,transparent 0 30px,#a2b0ca18 31px 32px)}
.inner-floor {position:absolute;box-sizing:border-box;border:1px solid #9be8cb80;border-radius:0 0 7px 7px;background:#9be8cb19;pointer-events:none}
.zone-label {position:absolute;top:8px;left:50%;transform:translateX(-50%);pointer-events:none;color:#d2e2ee;font-size:.8rem;white-space:nowrap}
.stand-label {top:auto;bottom:8px}
#listener {position:absolute;transform:translate(-50%,-50%);pointer-events:none;background:#a5efcf;color:#12231d;border-radius:18px;padding:2px 8px;white-space:nowrap;font-size:.82rem}
#facing {position:absolute;left:50%;top:50%;width:0;height:0}
#facing::before {content:"";position:absolute;left:-6px;top:-24px;width:12px;height:13px;background:#a5efcf;clip-path:polygon(50% 0,100% 100%,50% 73%,0 100%)}
#status {min-height:1.55em;color:#b7ebd8;margin-top:10px}
.transport-panel {margin-top:16px;padding-top:14px;border-top:1px solid #30394b}
#file-note a {display:inline-block;margin-bottom:4px;color:#9be8cb;font-weight:700}
@media(max-width:735px){.grid{grid-template-columns:1fr}main{padding:20px 12px}}

.entry {box-sizing:border-box;position:relative;width:min(100%,440px);min-height:100svh;margin:auto;padding:24px;background:radial-gradient(ellipse at 60% 0,#252b13 0,transparent 42%),#0c0e0c;color:#f6f7ee}
.entry-kicker,.entry-brand {color:#d7f657;font-weight:750;letter-spacing:.16em;font-size:.75rem}
.entry h1 {font-size:clamp(2rem,9vw,3rem);line-height:1.1;margin:14px 0}
.entry p {color:#b1b5a8;font-size:.88rem}
.entry-home {display:flex;flex-direction:column;min-height:calc(100svh - 48px)}
.entry-intro {margin:auto 0}
.entry-intro span {display:block;color:#a1a78c}
.upload-tile {padding:15px;background:#20221e;border:1px solid #363a2d;border-radius:9px;display:flex;align-items:center;gap:14px;cursor:pointer;font-weight:700}
.upload-icon {background:#d7f657;color:#192003;padding:9px 12px;border-radius:5px}
.upload-tile small {color:#b1b5a8;font-weight:400}
.upload-tile:focus-within {outline:2px solid #d7f657}
.upload-tile input.visually-hidden {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.entry-top {display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.entry-top small {color:#b1b5a8}
.entry-back {border-radius:50%;background:#171a16;border-color:#343729}
.scene-card {display:flex;flex-direction:column;justify-content:space-between;width:100%;min-height:166px;margin:12px 0;padding:14px;text-align:left;background-size:100% 100%,100% 200%;border:1px solid #404236;border-radius:6px;background-repeat:no-repeat;background-color:#171a16}
.scene-card[data-venue="arena"] {background-image:linear-gradient(180deg,#05050a35,#080909e8 86%),url("./unlive-scenes.webp");background-position:center top}
.scene-card[data-venue="livehouse"] {background-image:linear-gradient(180deg,#09050335,#080909e8 86%),url("./unlive-scenes.webp");background-position:center bottom}
.scene-card[aria-pressed=true] {background-color:#171a16;color:white;border-color:#d7f657}
.scene-card small {color:#d2d5c8;font-size:.68rem}
.scene-card strong {font-size:1.2rem}
.scene-card b {align-self:end;color:#d7f657}
.entry-next {display:flex;justify-content:space-between;width:100%;margin-top:18px;background:#d7f657;color:#171c0b;border:none;font-weight:750}
.entry-note {text-align:center;margin-top:15px;color:#a1a78c}

html, body {background:#0c0e0c;overflow-x:clip}
.player-screen .entry-top {margin-bottom:22px}
.player-screen h1 {font-size:clamp(1.85rem,7vw,2.5rem)}
.player-screen h2 {font-size:1rem}
.player-screen .grid {display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.player-screen .grid > section {background:#171a16;border:1px solid #343729;border-radius:9px;padding:14px;min-width:0}
.player-screen button {min-height:44px;background:#20221e;border-color:#404536}
.player-screen button[aria-pressed=true], .player-screen #play:not(:disabled) {background:#d7f657;border-color:#d7f657;color:#192003}
.player-screen .controls {gap:6px}
.player-screen .controls button {padding:6px 9px;font-size:.82rem;flex:1}
.player-screen .range {accent-color:#d7f657}
.player-screen #venue {height:clamp(170px,54vw,218px);background:linear-gradient(#262c1d,#12150f);border-color:#404536}
.player-screen .stage {background:#3e4826}
.player-screen .floor {border-color:#687350}
.player-screen .inner-floor {border-color:#d7f65780;background:#d7f65718}
.player-screen #listener,.player-screen #facing::before {background:#d7f657}
.player-screen #status {color:#d7f657;margin:0 0 8px;min-height:0}
.player-screen #status:empty {display:none}
.player-screen .transport-panel {margin:0;padding:0;border:0}
@media(max-width:360px) {.entry {padding:16px}.entry-home {min-height:calc(100svh - 32px)}}
</style>
</head>
<body>
<section class="entry" id="entry">
<div class="entry-home" id="entry-home">
<div class="entry-brand">◖ UNLIVE</div>
<div class="entry-intro"><div class="entry-kicker">— 虚拟现场聆听</div>
<h1>让未曾唱响的现场，<span>也能够被听见</span></h1>
<p>上传一段你喜欢的音乐，走进不同的空间，听见现场。</p></div>
<label class="upload-tile"><span class="upload-icon" aria-hidden="true">↑</span><span>上传你的音乐<small>MP3、WAV、FLAC · 最大 50 MB</small></span>
<input class="visually-hidden" id="entry-file" type="file" accept=".mp3,.wav,.flac,audio/mpeg,audio/wav,audio/flac"></label>
<small class="entry-note" id="entry-status" role="status">超过 4 分 30 秒会裁掉末尾</small>
</div>
<div id="entry-scenes" hidden>
<div class="entry-top"><button class="entry-back" id="entry-back" aria-label="返回上传">‹</button><small>02 / 03</small></div>
<div class="entry-kicker">— SELECT YOUR SPACE</div>
<h1>今晚，去哪个现场？</h1>
<p>选择一种空间，感受截然不同的声音氛围。</p>
<div id="scene-cards" role="group" aria-label="选择场馆">
<button class="scene-card" data-venue="arena" aria-pressed="false"><small>01</small><span><strong>演唱会</strong><small>CONCERT</small></span><small>大型舞台，开阔声场　<span class="scene-check" aria-hidden="true">○</span></small></button>
<button class="scene-card" data-venue="livehouse" aria-pressed="false"><small>02</small><span><strong>LIVEHOUSE</strong><small>LIVE VENUE</small></span><small>近距离舞台，紧凑声场　<span class="scene-check" aria-hidden="true">○</span></small></button>
</div>
<button class="entry-next" id="entry-next" disabled><span id="entry-next-text">请选择一个现场</span><span aria-hidden="true">→</span></button>
<small class="entry-note">戴好你的耳机，准备就绪</small>
</div>
</section>
<main class="entry player-screen" id="player-screen" hidden>
<div class="entry-top"><button class="entry-back" id="player-back" type="button" aria-label="返回选场">‹</button><small>03 / 03</small></div>
<div class="entry-kicker" id="player-venue">演唱会</div>
<h1>现场试听</h1>
<div class="grid">
<section aria-labelledby="venue-title">
<h2 id="venue-title">拖动我的位置，探索听感</h2>
<p class="muted">可拖动、点选，或聚焦场地图后用方向键移动。看台朝向随座位转向舞台。</p>
<div class="controls" role="group" aria-label="场馆模式" id="venue-modes">
<button type="button" data-venue="arena" aria-pressed="true">演唱会</button>
<button type="button" data-venue="livehouse" aria-pressed="false">Livehouse</button>
</div>
<div id="venue" tabindex="0" role="group" aria-label="虚拟场地，可用方向键移动">
<div class="stage" id="stage">舞台 · 歌手</div>
<div class="floor" id="floor">
<div class="inner-floor" id="inner-floor" aria-hidden="true"><span class="zone-label">内场</span></div>
<span class="zone-label stand-label" id="stand-label" aria-hidden="true">看台</span>
<span id="listener"><span id="facing" aria-hidden="true"></span>我</span>
</div>
</div>
<div class="controls" id="presets">
<button data-position="front">前排中央</button><button data-position="rear">后排中央</button><button data-position="left">左侧</button><button data-position="right">右侧</button>
</div>
<label class="range-label" for="intensity">现场感强度 <output id="strength">65%</output></label>
<input class="range" id="intensity" type="range" min="0" max="100" value="65">
<small>混响为程序合成，用于模拟场地听感。</small>
</section>
<section class="player-controls" aria-label="音频与播放">
<p id="status" role="status"></p>
<div class="transport-panel" role="group" aria-labelledby="play-heading">
<h2 id="play-heading">试听与对比</h2>
<div class="controls">
<button id="play" disabled>播放</button><button id="spatial" aria-pressed="true">空间版</button>
<button id="dry" aria-pressed="false" disabled aria-describedby="compare-note">原版</button><button id="reset">重置</button>
</div>
<small id="compare-note">导入音频后即可切换原版和空间版。</small>
<label class="range-label" for="seek">播放进度 <output id="clock">0:00 / 0:00</output></label>
<input class="range" id="seek" type="range" value="0" max="0" min="0" step="0.01" disabled>
</div>
</section>
</div>
</main>
<script src="./demucs/session-store.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const MAX_SECONDS = 270;
const DEFAULT_INTENSITY = 65;
const MAX_BYTES = 50_000_000;
const slots = {};
for (const key of ["voice", "music", "original"]) {
  slots[key] = { buffer: null, rms: 0 };
}
const presets = {
  front: { x: 0, z: 2 },
  rear: { x: 0, z: 11 },
  left: { x: -4.5, z: 5 },
  right: { x: 4.5, z: 5 }
};
let venueMode = "arena";
let position = { ...presets.front };
let context, graph, active;
let offset = 0;
let length = 0;
let canCompare = false;
let mode = "spatial";
let intent = 0;
let seeking = false;
let loading = false;
const JOB_KEY = "unlive-current-mix";
let sourceId;

function readSession() {
  try { return JSON.parse(sessionStorage.getItem(JOB_KEY)); }
  catch { return null; }
}

function saveSession() {
  try {
    if (!sourceId) return sessionStorage.removeItem(JOB_KEY);
    sessionStorage.setItem(JOB_KEY, JSON.stringify({
      id: sourceId, offset: positionNow(), position, mode,
      intensity: $("intensity").value, venue: venueMode
    }));
  } catch { /* Playback can continue when storage is unavailable. */ }
}

window.addEventListener("pagehide", saveSession);

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const status = message => { $("status").textContent = message; };

function audioContext() {
  if (!context) {
    const AudioEngine = window.AudioContext || window.webkitAudioContext;
    if (!AudioEngine) throw new Error("当前浏览器不支持 Web Audio，请使用 Chrome 或 Edge。");
    context = new AudioEngine();
  }
  return context;
}

// 沿用现有的横向 ±6 米、纵向 1.6 至 12 米，舞台在 -Z 方向。
// 内场贴近舞台，左右和后方的剩余区域是看台。
const inner = { halfWidth: 3, rear: 7.8 };
const innerArea = $("inner-floor");
innerArea.style.left = (6 - inner.halfWidth) / 12 * 100 + "%";
innerArea.style.width = inner.halfWidth / 6 * 100 + "%";
innerArea.style.height = (inner.rear - 1.6) / 10.4 * 100 + "%";

function seatElevation({ x, z }) {
  const side = (Math.abs(x) - inner.halfWidth) / (6 - inner.halfWidth);
  const rear = (z - inner.rear) / (12 - inner.rear);
  // 取更靠外的一侧，转角不会比其它外缘更低，交界处连续。
  const tier = clamp(Math.max(side, rear), 0, 1);
  return { zone: tier > 0 ? "看台" : "内场", y: 3 - 12 * tier, tier };
}

// 舞台几何中心是平面坐标原点。Web Audio 中 +X 对应听众右耳，-Z 对应正前。
function stageDirection({ x, z }, venue = venueMode) {
  // 同一张图映射到更小的房间。所有座位在同一层，音箱在耳高上方 4.2 米。
  if (venue === "livehouse") return { x: -x * 0.55, y: 4.2, z: -z * 0.5 };
  const { y, tier } = seatElevation({ x, z });
  const bearing = Math.atan2(-x, z);
  // 看台转向舞台中心时恰好居中。额外转最多 12°，保留侧看台的同侧来声。
  // 中轴不偏向任何一耳。交界后逐渐转头，避免跨区时声像跳变。
  const sideBias = x / 6 * Math.PI / 15;
  const progress = clamp(tier / 0.35, 0, 1);
  const turn = progress ** 2 * (3 - 2 * progress);
  const relative = bearing * (1 - turn) + sideBias * turn;
  const distance = Math.hypot(x, z);
  return { x: Math.sin(relative) * distance, y, z: -Math.cos(relative) * distance };
}

function venueParameters({ x, z }, intensity, venue = venueMode) {
  const direction = stageDirection({ x, z }, venue);
  const distance = Math.hypot(direction.x, direction.z);
  if (venue === "livehouse") {
    const back = clamp((distance - 0.8) / 6, 0, 1);
    return {
      ...direction,
      direct: 0.98 - 0.16 * back,
      cutoff: 18000 - 1800 * back,
      presence: 0.9 * back,
      vocalWrap: intensity * 0.12,
      voiceWet: intensity * (0.20 + 0.25 * back),
      musicWet: intensity * (0.16 + 0.14 * back),
      musicSide: intensity * 0.12
    };
  }
  const near = 1.6;
  const far = clamp((distance - near) / 11, 0, 1);
  return {
    ...direction,
    direct: 0.96 - 0.29 * far,
    cutoff: 17300 - 3200 * far,
    presence: 2.2 * far,
    vocalWrap: intensity * 0.48 * (1 - far) ** 2,
    voiceWet: intensity * (0.26 + 0.49 * far),
    musicWet: intensity * (0.22 + 0.21 * far),
    musicSide: intensity * (0.11 + 0.035 * far)
  };
}

function ramp(param, value, seconds = 0.045) {
  param.setTargetAtTime(value, context.currentTime, seconds);
}

function updateFacing() {
  const stage = $("stage").getBoundingClientRect();
  const marker = $("listener").getBoundingClientRect();
  // 屏幕 Y 向下，小箭头的零角度向上。
  const dx = stage.left + stage.width / 2 - (marker.left + marker.width / 2);
  const dy = stage.top + stage.height / 2 - (marker.top + marker.height / 2);
  $("facing").style.transform = "rotate(" + Math.atan2(dx, -dy) + "rad)";
}

window.addEventListener("resize", updateFacing);

function paintPosition() {
  $("listener").style.left = (position.x + 6) / 12 * 100 + "%";
  $("listener").style.top = (position.z - 1.6) / 10.4 * 100 + "%";
  updateFacing();
  for (const button of $("presets").querySelectorAll("button")) {
    const preset = presets[button.dataset.position];
    button.setAttribute("aria-pressed", preset.x === position.x && preset.z === position.z);
  }
  const livehouse = venueMode === "livehouse";
  $("inner-floor").hidden = livehouse;
  $("stand-label").textContent = livehouse ? "单层观众区" : "看台";
  $("player-venue").textContent = livehouse ? "LIVEHOUSE" : "演唱会";
  $("presets").querySelector('[data-position="rear"]').textContent = livehouse ? "后场中央" : "后排中央";
  for (const button of $("venue-modes").querySelectorAll("button")) {
    button.setAttribute("aria-pressed", button.dataset.venue === venueMode);
  }
  const zone = livehouse ? "单层观众区" : seatElevation(position).zone;
  const { x, y } = stageDirection(position);
  const height = Math.round(y * 10) / 10;
  const direction = height > 0 ? "上方" : "下方";
  const relative = height === 0 ? "舞台来声与耳朵等高" : "舞台来声在耳朵" + direction + "约 " + Math.abs(height).toFixed(1) + " 米";
  const side = Math.abs(x) < 0.05 ? "正前" : x < 0 ? "左前" : "右前";
  const label = zone + " · " + side + " · " + relative;
  $("venue").setAttribute("aria-label", "虚拟场地，可用方向键移动。" + label);
}

function updateVenue(immediate = false) {
  paintPosition();
  const strength = +$("intensity").value;
  $("strength").value = strength + "%";
  if (!graph) return;
  const p = venueParameters(position, strength / 100);
  for (const [param, value] of [
    [graph.pan.positionX, p.x], [graph.pan.positionY, p.y], [graph.pan.positionZ, p.z]
  ]) {
    if (immediate === true) param.setValueAtTime(value, context.currentTime);
    else ramp(param, value);
  }
  ramp(graph.voiceDirect.gain, p.direct);
  ramp(graph.filter.frequency, p.cutoff);
  ramp(graph.presence.gain, p.presence);
  ramp(graph.wrapSend.gain, p.vocalWrap);
  ramp(graph.voiceSend.gain, p.voiceWet);
  ramp(graph.musicSend.gain, p.musicWet);
  ramp(graph.widthLeft.gain, p.musicSide);
  ramp(graph.widthRight.gain, p.musicSide);
  ramp(graph.crossLeft.gain, -p.musicSide);
  ramp(graph.crossRight.gain, -p.musicSide);
}

function move(x, z) {
  position = { x: clamp(x, -6, 6), z: clamp(z, 1.6, 12) };
  updateVenue();
}

function placePointer(event) {
  const box = $("floor").getBoundingClientRect();
  move((event.clientX - box.left) / box.width * 12 - 6,
       (event.clientY - box.top) / box.height * 10.4 + 1.6);
}

$("floor").onpointerdown = event => {
  if (event.button !== 0) return;
  $("floor").setPointerCapture(event.pointerId);
  placePointer(event);
};
$("floor").onpointermove = event => {
  if ($("floor").hasPointerCapture(event.pointerId)) placePointer(event);
};
$("venue").onkeydown = event => {
  const axis = { ArrowLeft: [-0.5, 0], ArrowRight: [0.5, 0], ArrowUp: [0, -0.5], ArrowDown: [0, 0.5] }[event.key];
  if (!axis) return;
  event.preventDefault();
  move(position.x + axis[0], position.z + axis[1]);
};
$("presets").onclick = event => {
  const preset = presets[event.target.dataset.position];
  if (preset) move(preset.x, preset.z);
};
$("intensity").oninput = updateVenue;
$("venue-modes").onclick = event => {
  const next = event.target.dataset.venue;
  if (!next || next === venueMode) return;
  const wasPlaying = Boolean(active);
  pause();
  venueMode = next;
  if (wasPlaying && offset < length) begin(offset);
  else updateVenue();
  saveSession();
};

function makeImpulse(ctx, venue = venueMode) {
  const compact = venue === "livehouse";
  const timeScale = compact ? 0.42 : 1;
  const ir = ctx.createBuffer(2, Math.floor(ctx.sampleRate * (compact ? 0.8 : 2.4)), ctx.sampleRate);
  const reflections = [
    [[0.023, 0.31], [0.043, 0.24], [0.077, 0.18], [0.111, 0.11]],
    [[0.031, 0.31], [0.056, 0.24], [0.088, 0.18], [0.128, 0.11]]
  ];
  let seed = 12345;
  for (let channel = 0; channel < 2; channel++) {
    const data = ir.getChannelData(channel);
    const onset = Math.floor(ctx.sampleRate * (channel ? 0.063 : 0.051) * timeScale);
    let smooth = 0;
    let energy = 0;
    for (let i = onset; i < data.length; i++) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      smooth = 0.55 * smooth + 0.45 * (seed / 2147483648 - 1);
      const elapsed = (i - onset) / ctx.sampleRate;
      data[i] = smooth * Math.min(elapsed / (0.06 * timeScale), 1) * Math.exp(-elapsed * 3.1 / timeScale);
      energy += data[i] ** 2;
    }
    const tailScale = 0.48 / Math.sqrt(Math.max(energy, 1e-9));
    for (let i = onset; i < data.length; i++) data[i] *= tailScale;
    for (const [seconds, gain] of reflections[channel]) {
      const tap = Math.floor(ctx.sampleRate * seconds * timeScale);
      data[tap] += gain * 0.7;
      data[tap + 1] += gain * 0.3;
    }
  }
  return ir;
}

function makeVocalReflections(ctx) {
  const ir = ctx.createBuffer(2, Math.ceil(ctx.sampleRate * 0.11), ctx.sampleRate);
  const sides = [
    [[0.013, 0.60], [0.037, -0.27], [0.068, 0.18]],
    [[0.019, 0.60], [0.030, 0.27], [0.077, -0.18]]
  ];
  sides.forEach((taps, channel) => {
    const samples = ir.getChannelData(channel);
    for (const [seconds, amplitude] of taps) {
      const frame = Math.round(seconds * ctx.sampleRate);
      samples[frame] = 0.7 * amplitude;
      samples[frame + 1] = 0.3 * amplitude;
    }
  });
  return ir;
}

function buildGraph(ctx) {
  const gain = value => {
    const node = ctx.createGain();
    node.gain.value = value;
    return node;
  };
  const voiceInput = gain(1);
  // 按 Web Audio 的 speakers 规则把立体声平均折为单声道。
  voiceInput.channelCount = 1;
  voiceInput.channelCountMode = "explicit";
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  const presence = ctx.createBiquadFilter();
  presence.type = "peaking";
  presence.frequency.value = 2750;
  presence.Q.value = 0.8;
  const pan = ctx.createPanner();
  pan.panningModel = "HRTF";
  pan.distanceModel = "inverse";
  pan.rolloffFactor = 0; // 距离增益只由 voiceDirect 控制。
  const voiceDirect = gain(0.9);
  const voiceSend = gain(0);
  const wrapSend = gain(0);
  const wrapRoom = ctx.createConvolver();
  wrapRoom.normalize = false;
  wrapRoom.buffer = makeVocalReflections(ctx);
  const wrapTone = ctx.createBiquadFilter();
  wrapTone.type = "lowpass";
  wrapTone.frequency.value = 4800;
  const musicInput = gain(1);
  const musicSend = gain(0);
  const room = ctx.createConvolver();
  const ir = makeImpulse(ctx);
  // 反射声与尾声已分别定标，禁用浏览器二次归一化。
  room.normalize = false;
  room.buffer = ir;
  const roomTone = ctx.createBiquadFilter();
  roomTone.type = "lowpass";
  roomTone.frequency.value = 6200;
  const split = ctx.createChannelSplitter(2);
  const merge = ctx.createChannelMerger(2);
  const widthLeft = gain(0), widthRight = gain(0);
  const crossLeft = gain(0), crossRight = gain(0);
  const spatial = gain(1);
  const original = gain(0);
  const transport = gain(0);
  const headroom = gain(0.58);
  const compressor = ctx.createDynamicsCompressor();
  compressor.threshold.value = -7;
  compressor.knee.value = 8;
  compressor.ratio.value = 10;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.15;

  voiceInput.connect(filter).connect(presence).connect(pan).connect(voiceDirect).connect(spatial);
  voiceInput.connect(voiceSend).connect(room);
  voiceInput.connect(wrapSend).connect(wrapRoom).connect(wrapTone).connect(spatial);
  musicInput.connect(spatial);
  // 只提高伴奏的左右差分。中央成分与原来的干声保持一致。
  musicInput.connect(split);
  split.connect(widthLeft, 0).connect(merge, 0, 0);
  split.connect(widthRight, 1).connect(merge, 0, 1);
  split.connect(crossLeft, 1).connect(merge, 0, 0);
  split.connect(crossRight, 0).connect(merge, 0, 1);
  merge.connect(spatial);
  musicInput.connect(musicSend).connect(room);
  room.connect(roomTone).connect(spatial);
  spatial.connect(transport);
  original.connect(transport);
  transport.connect(headroom).connect(compressor).connect(ctx.destination);
  return { voiceInput, filter, presence, pan, voiceDirect, voiceSend, wrapSend, musicInput, musicSend,
           widthLeft, widthRight, crossLeft, crossRight, spatial, original, transport, compressor };
}

function measuredRms(buffer, count = buffer.numberOfChannels) {
  const channels = Array.from({ length: count }, (_, i) => buffer.getChannelData(i));
  const stride = Math.max(1, Math.floor(buffer.length / 40000));
  let energy = 0;
  let n = 0;
  for (let frame = 0; frame < buffer.length; frame += stride) {
    for (const channel of channels) {
      energy += channel[frame] ** 2;
      n++;
    }
  }
  return Math.sqrt(energy / Math.max(n, 1));
}

function setMode(next, immediate = false) {
  mode = next === "original" && canCompare ? next : "spatial";
  $("spatial").setAttribute("aria-pressed", mode === "spatial");
  $("dry").setAttribute("aria-pressed", mode === "original");
  if (!graph) return;
  const estimate = Math.hypot(slots.voice.rms * 0.82, slots.music.rms);
  const reference = slots.original.rms;
  // 粗略匹配响度，限制补偿幅度。两套总线仅在短交叉淡化窗口内同时打开。
  const correction = reference > 0.001 ? clamp(estimate / reference, 0.65, 1.4) : 1;
  const spatialGain = mode === "spatial" ? 1 : 0;
  const originalGain = mode === "original" ? correction : 0;
  if (immediate) {
    for (const [param, value] of [[graph.spatial.gain, spatialGain], [graph.original.gain, originalGain]]) {
      param.cancelScheduledValues(context.currentTime);
      param.value = value;
    }
  } else {
    ramp(graph.spatial.gain, spatialGain, 0.014);
    ramp(graph.original.gain, originalGain, 0.014);
  }
}

function positionNow() {
  return active ? clamp(active.offset + Math.max(0, context.currentTime - active.at), 0, length) : offset;
}

function stopSources() {
  if (!active) return;
  const previous = active;
  active = null;
  // 旧播放图整体淡出，新图在其停止之后开始，避免快速操作叠播。
  const now = context.currentTime;
  const end = now + 0.012;
  const gate = previous.graph.transport.gain;
  gate.cancelScheduledValues(now);
  gate.setValueAtTime(gate.value, now);
  gate.linearRampToValueAtTime(0, end);
  previous.sources.forEach(source => source.stop(end));
  setTimeout(() => previous.graph.compressor.disconnect(), 35);
  graph = null;
}

function pause() {
  intent++;
  seeking = false;
  offset = positionNow();
  stopSources();
  updateTransport();
}

function begin(atOffset) {
  const ctx = context;
  graph = buildGraph(ctx);
  updateVenue(true);
  setMode(mode, true);
  const at = ctx.currentTime + 0.025;
  const nodes = [
    [slots.voice.buffer, graph.voiceInput],
    [slots.music.buffer, graph.musicInput]
  ];
  if (canCompare) nodes.push([slots.original.buffer, graph.original]);
  const duration = length - atOffset;
  const sources = nodes.map(([buffer, target]) => {
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(target);
    source.start(at, atOffset, duration);
    return source;
  });
  const state = { at, offset: atOffset, sources, graph };
  active = state;
  graph.transport.gain.setValueAtTime(0, at);
  graph.transport.gain.linearRampToValueAtTime(1, at + 0.02);
  sources[0].onended = () => {
    if (active !== state) return;
    offset = length;
    stopSources();
    status("试听结束。");
    updateTransport();
  };
  updateTransport();
}

async function play() {
  if (!length) return;
  const request = ++intent;
  try {
    const ctx = audioContext();
    // 由点击事件解锁音频。过期的 resume 请求不得启动新音源。
    await ctx.resume();
    if (request !== intent || !length) return;
    if (ctx.state !== "running") throw new Error("浏览器暂未允许自动播放，请点击「播放」。");
    begin(offset >= length ? 0 : offset);
    status("正在试听。");
  } catch (error) {
    if (request !== intent) return;
    status(error.message || "无法启动音频。");
    updateTransport();
  }
}

function timeLabel(seconds) {
  const n = Math.floor(seconds);
  return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
}

function updateTransport() {
  $("play").textContent = active ? "暂停" : "播放";
  if (seeking) return;
  const position = positionNow();
  $("seek").value = position;
  $("clock").value = timeLabel(position) + " / " + timeLabel(length);
}

function refreshFiles() {
  length = loading ? 0 : (slots.original.buffer?.duration ?? 0);
  canCompare = Boolean(length);
  $("play").disabled = $("seek").disabled = $("dry").disabled = !length;
  $("seek").max = length;
  $("compare-note").textContent = length
    ? "两种版本共享播放进度，切换时会短暂淡化。"
    : "导入音频后即可切换原版和空间版。";
  setMode(mode);
  updateTransport();
}

async function decodeBrowserRecording(file, ctx, info) {
  info.textContent = "正在读取音频…";
  let original;
  try {
    original = await new OfflineAudioContext(2, 1, 44100).decodeAudioData(await file.arrayBuffer());
  } catch {
    throw new Error("无法解码音频，请尝试 WAV 或 MP3。");
  }
  if (original.duration < .1) throw new Error("音频不足 0.1 秒。");
  if (![1, 2].includes(original.numberOfChannels)) throw new Error("仅支持单声道或立体声录音。");
  const maxFrames = MAX_SECONDS * original.sampleRate;
  if (original.length > maxFrames) {
    const clipped = ctx.createBuffer(original.numberOfChannels, maxFrames, original.sampleRate);
    for (let channel = 0; channel < original.numberOfChannels; channel++) {
      clipped.copyToChannel(original.getChannelData(channel).subarray(0, maxFrames), channel);
    }
    original = clipped;
  }
  return original;
}

function splitStereoImage(original, ctx) {
  const { length, sampleRate, numberOfChannels } = original;
  const center = ctx.createBuffer(1, length, sampleRate);
  const side = ctx.createBuffer(2, length, sampleRate);
  const left = original.getChannelData(0);
  const right = original.getChannelData(numberOfChannels === 1 ? 0 : 1);
  const mid = center.getChannelData(0);
  const sideLeft = side.getChannelData(0);
  const sideRight = side.getChannelData(1);
  for (let i = 0; i < length; i++) {
    mid[i] = (left[i] + right[i]) * 0.5;
    sideLeft[i] = (left[i] - right[i]) * 0.5;
    sideRight[i] = -sideLeft[i];
  }
  return [center, side, original];
}

async function processRecording(file, restore) {
  if (!file || loading) return;
  const info = $("entry-status");
  const input = $("entry-file");
  if (file.size > MAX_BYTES || !/\.(mp3|wav|flac)$/i.test(file.name)) {
    info.textContent = "请选择不超过 50 MB 的 MP3、WAV 或 FLAC 文件。";
    return;
  }
  pause();
  const previousId = sourceId;
  sourceId = undefined;
  saveSession();
  if (previousId) separationStore.remove(previousId).catch(() => {});
  for (const slot of Object.values(slots)) slot.buffer = null;
  offset = 0;
  mode = "spatial";
  input.disabled = loading = true;
  status("");
  refreshFiles();
  try {
    const ctx = audioContext();
    // File selection may unlock audio. Avoid waiting on browsers that require a Play click.
    if (!restore && ctx.state !== "running") ctx.resume().catch(() => {});
    const original = await decodeBrowserRecording(file, ctx, info);
    const buffers = splitStereoImage(original, ctx);
    Object.values(slots).forEach((slot, index) => {
      slot.buffer = buffers[index];
      slot.rms = measuredRms(slot.buffer);
    });
    if (restore) {
      offset = clamp(restore.offset || 0, 0, original.duration);
      $("intensity").value = restore.intensity ?? DEFAULT_INTENSITY;
      venueMode = restore.venue === "livehouse" ? "livehouse" : "arena";
      updateVenue();
      if (restore.position) move(restore.position.x, restore.position.z);
      mode = restore.mode === "original" ? "original" : "spatial";
      sourceId = restore.id;
    } else {
      const id = String(Date.now()) + "-mix-" + Math.random().toString(36).slice(2);
      sourceId = id;
      separationStore.put([id, "source"], file).then(() => {
        if (sourceId === id) saveSession();
        else return separationStore.remove(id);
      }).catch(() => {});
    }
    info.textContent = file.name + " · 整轨空间版已就绪。";
    status("点击播放，拖动场地图上的位置探索听感。");
  } catch (error) {
    for (const slot of Object.values(slots)) slot.buffer = null;
    info.textContent = "无法读取音频 · " + error.message + " 可重新选择文件。";
  } finally {
    input.disabled = loading = false;
    refreshFiles();
  }
}

let selectedScene;
function selectEntryScene(next) {
  selectedScene = next;
  for (const card of $("scene-cards").querySelectorAll("button")) {
    const selected = card.dataset.venue === next;
    card.setAttribute("aria-pressed", selected);
    card.querySelector(".scene-check").textContent = selected ? "●" : "○";
  }
  $("entry-next").disabled = !next;
  $("entry-next-text").textContent = next ? "进入现场" : "请选择一个现场";
}

function showScreen(next, focusId, back = false) {
  $("entry").hidden = next === "player-screen";
  $("entry-home").hidden = next !== "entry-home";
  $("entry-scenes").hidden = next !== "entry-scenes";
  $("player-screen").hidden = next !== "player-screen";
  window.scrollTo(0, 0);
  const screen = $(next);
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    screen.animate([
      { opacity: 0, transform: "translateX(" + (back ? -12 : 12) + "px)" },
      { opacity: 1, transform: "translateX(0)" }
    ], { duration: 240, easing: "cubic-bezier(.22,.72,.25,1)" });
  }
  if (focusId) $(focusId).focus({ preventScroll: true });
}

$("entry-file").onchange = async event => {
  const input = event.target;
  const file = input.files[0];
  if (!file || loading) return;
  if (file.size > MAX_BYTES || !/\.(mp3|wav|flac)$/i.test(file.name)) {
    $("entry-status").textContent = "请选择不超过 50 MB 的 MP3、WAV 或 FLAC 文件。";
    input.value = "";
    return;
  }
  input.disabled = true;
  $("entry-status").textContent = "正在读取音频…";
  try {
    await processRecording(file);
    if (!length) {
      return;
    }
    selectEntryScene(undefined);
    showScreen("entry-scenes", "entry-back");
  } finally {
    input.disabled = false;
    input.value = "";
  }
};

$("entry-back").onclick = () => {
  $("entry-status").textContent = "超过 4 分 30 秒会裁掉末尾";
  showScreen("entry-home", "entry-file", true);
};

$("scene-cards").onclick = event => {
  const card = event.target.closest("[data-venue]");
  if (card) selectEntryScene(card.dataset.venue);
};

$("entry-next").onclick = () => {
  if (!selectedScene || !length) return;
  venueMode = selectedScene;
  showScreen("player-screen", "play");
  updateVenue();
  play();
};

$("player-back").onclick = () => {
  pause();
  selectEntryScene(venueMode);
  showScreen("entry-scenes", "entry-next", true);
};

$("play").onclick = () => {
  if (active) { pause(); status("已暂停。"); }
  else play();
};
$("seek").oninput = event => {
  seeking = true;
  $("clock").value = timeLabel(Number(event.target.value)) + " / " + timeLabel(length);
};
$("seek").onblur = () => {
  seeking = false;
  updateTransport();
};
$("seek").onchange = event => {
  const target = Number(event.target.value);
  const wasPlaying = Boolean(active);
  pause();
  offset = target;
  if (wasPlaying && offset < length) begin(offset);
  if (wasPlaying && offset >= length) {
    status("已到结尾。");
  }
  updateTransport();
};
$("spatial").onclick = () => setMode("spatial");
$("dry").onclick = () => setMode("original");
$("reset").onclick = () => {
  pause();
  offset = 0;
  $("intensity").value = DEFAULT_INTENSITY;
  setMode("spatial");
  move(presets.front.x, presets.front.z);
  updateTransport();
  if (length) status("已重置位置、强度和进度，保留导入的文件。");
};

function frame() {
  if (active) updateTransport();
  requestAnimationFrame(frame);
}
updateVenue();
refreshFiles();
requestAnimationFrame(frame);

if (location.protocol !== "file:") {
  separationStore.cleanOld().catch(() => {});
  const restore = readSession();
  if (typeof restore?.id === "string") {
    separationStore.get([restore.id, "source"]).then(file => {
      if (loading || length) return;
      if (file) processRecording(file, restore).then(() => {
        if (!length) return;
        selectEntryScene(venueMode);
        showScreen("entry-scenes");
      });
      else $("entry-status").textContent = "找不到上次的音频，请重新选择文件。";
    }).catch(() => {});
  }
}
</script>
</body>
